[project]
name = "tacular"
dynamic = ["version"]
description = "Proteomics ontology and reference-data lookups in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/tacular"
Documentation = "https://tacular.readthedocs.io/"
Repository = "https://github.com/tacular-omics/tacular"
Issues = "https://github.com/tacular-omics/tacular/issues"
Changelog = "https://github.com/tacular-omics/tacular/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.18475556"

[project.scripts]
tacular = "tacular.update:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tacular/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tacular"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
    "pytest-cov>=7.1.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=3.13.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["**/data.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B019",  # Use of functools.lru_cache/cache on methods - intentional for lookup performance
]
